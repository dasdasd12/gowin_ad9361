<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>局域网视频通话</title>
    <script src="./peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 25px;
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 26px;
        }

        .setup-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            color: #555;
            font-weight: 500;
            margin-bottom: 4px;
        }

        input {
            padding: 8px 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #38a169;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #e53e3e;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status {
            flex: 1;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 0;
            font-weight: 500;
            text-align: center;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
        }

        .status.info {
            background: #bee3f8;
            color: #2c5282;
        }

        .status.success {
            background: #c6f6d5;
            color: #22543d;
        }

        .status.error {
            background: #fed7d7;
            color: #742a2a;
        }

        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 4px;
        }

        .divider {
            width: 2px;
            background: #ddd;
            margin: 0 5px;
        }

        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }

            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- <h1>🎥 局域网视频通话</h1> -->

        <div class="setup-section">
            <!-- <div class="section-title">PeerJS 服务器配置</div> -->
            <div class="row">
                <div class="input-group">
                    <label>PeerJS 服务器地址</label>
                    <input type="text" id="serverHost" value="192.168.1.2" placeholder="192.168.1.2">
                </div>
                <div class="input-group">
                    <label>PeerJS 端口</label>
                    <input type="text" id="serverPort" value="9000" placeholder="9000">
                </div>
                <div class="input-group">
                    <label>PeerJS 路径</label>
                    <input type="text" id="serverPath" value="/myapp" placeholder="/myapp">
                </div>
            </div>

            <!-- <div class="section-title" style="margin-top: 12px;">ICE 服务器配置</div> -->
            <div class="row">
                <div class="input-group">
                    <label>STUN 服务器地址</label>
                    <input type="text" id="stunServer" value="192.168.1.2" placeholder="192.168.1.2">
                </div>
                <div class="input-group">
                    <label>STUN 端口</label>
                    <input type="text" id="stunPort" value="3478" placeholder="3478">
                </div>
            </div>

            <!-- <div class="section-title" style="margin-top: 12px;">用户 ID 配置</div> -->
            <div class="row">
                <div class="input-group">
                    <label>我的 ID</label>
                    <input type="text" id="myId" value="user1" placeholder="例如: user1">
                </div>
                <div class="input-group">
                    <label>对方 ID</label>
                    <input type="text" id="remoteId" value="user2" placeholder="例如: user2">
                </div>
            </div>

            <div class="button-group">
                <button class="btn-primary" id="initBtn">初始化连接</button>
                <button class="btn-success" id="callBtn" disabled>📞 呼叫</button>
                <button class="btn-danger" id="hangupBtn" disabled>挂断</button>
                <div class="divider"></div>
                <div id="statusMsg" class="status info">请初始化连接</div>
            </div>
        </div>




        <div class="video-container hidden" id="videoContainer">
            <div class="video-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label">本地视频</div>
            </div>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">远程视频</div>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let localStream = null;
        let currentCall = null;

        const elements = {
            serverHost: document.getElementById('serverHost'),
            serverPort: document.getElementById('serverPort'),
            serverPath: document.getElementById('serverPath'),
            stunServer: document.getElementById('stunServer'),
            stunPort: document.getElementById('stunPort'),
            myId: document.getElementById('myId'),
            remoteId: document.getElementById('remoteId'),
            initBtn: document.getElementById('initBtn'),
            callBtn: document.getElementById('callBtn'),
            hangupBtn: document.getElementById('hangupBtn'),
            statusMsg: document.getElementById('statusMsg'),
            videoContainer: document.getElementById('videoContainer'),
            localVideo: document.getElementById('localVideo'),
            remoteVideo: document.getElementById('remoteVideo')
        };

        function showStatus(message, type = 'info') {
            elements.statusMsg.textContent = message;
            elements.statusMsg.className = `status ${type}`;
            elements.statusMsg.classList.remove('hidden');
        }

        async function getLocalStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                elements.localVideo.srcObject = localStream;
                return localStream;
            } catch (err) {
                showStatus('无法访问摄像头/麦克风: ' + err.message, 'error');
                throw err;
            }
        }

        elements.initBtn.addEventListener('click', async () => {
            const host = elements.serverHost.value.trim();
            const port = elements.serverPort.value.trim();
            const path = elements.serverPath.value.trim();
            const stunServer = elements.stunServer.value.trim();
            const stunPort = elements.stunPort.value.trim();
            const myId = elements.myId.value.trim();

            if (!host || !port || !myId) {
                showStatus('请填写服务器地址、端口和我的ID', 'error');
                return;
            }

            try {
                showStatus('正在初始化...', 'info');

                // 获取本地媒体流
                await getLocalStream();

                // 构建 ICE 服务器配置
                const iceServers = [];
                if (stunServer && stunPort) {
                    iceServers.push({
                        urls: `stun:${stunServer}:${stunPort}`
                    });
                }

                // 创建 Peer 连接
                peer = new Peer(myId, {
                    host: host,
                    port: parseInt(port),
                    path: path || '/myapp',
                    debug: 3,
                    config: {
                        iceServers: iceServers.length > 0 ? iceServers : [{ urls: 'stun:stun.l.google.com:19302' }]
                    }
                });

                peer.on('open', (id) => {
                    showStatus(`连接成功！你的 ID: ${id}`, 'success');
                    elements.videoContainer.classList.remove('hidden');
                    elements.initBtn.disabled = true;
                    elements.callBtn.disabled = false;
                });

                peer.on('error', (err) => {
                    showStatus('连接错误: ' + err.message, 'error');
                    console.error('Peer error:', err);
                });

                // 监听来电
                peer.on('call', (call) => {
                    showStatus('收到来电，正在应答...', 'info');
                    if (localStream) {
                        call.answer(localStream);
                        setupCall(call);
                    } else {
                        showStatus('本地媒体流未准备好', 'error');
                    }
                });

            } catch (err) {
                showStatus('初始化失败: ' + err.message, 'error');
            }
        });

        elements.callBtn.addEventListener('click', () => {
            const remoteId = elements.remoteId.value.trim();

            if (!remoteId) {
                showStatus('请输入对方 ID', 'error');
                return;
            }

            if (!peer) {
                showStatus('请先初始化连接', 'error');
                return;
            }

            showStatus('正在呼叫...', 'info');
            const call = peer.call(remoteId, localStream);
            setupCall(call);
        });

        function setupCall(call) {
            currentCall = call;

            call.on('stream', (remoteStream) => {
                console.log('Received remote stream tracks:', remoteStream.getTracks());
                showStatus('通话已建立', 'success');
                elements.remoteVideo.srcObject = remoteStream;
                elements.callBtn.disabled = true;
                elements.hangupBtn.disabled = false;
            });

            call.on('close', () => {
                showStatus('通话已结束', 'info');
                endCall();
            });

            call.on('error', (err) => {
                showStatus('通话错误: ' + err.message, 'error');
                endCall();
            });
        }

        elements.hangupBtn.addEventListener('click', () => {
            if (currentCall) {
                currentCall.close();
            }
            endCall();
        });

        function endCall() {
            if (currentCall) {
                currentCall.close();
                currentCall = null;
            }
            elements.remoteVideo.srcObject = null;
            elements.callBtn.disabled = false;
            elements.hangupBtn.disabled = true;
        }

        // 页面关闭时清理
        window.addEventListener('beforeunload', () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (peer) {
                peer.destroy();
            }
        });
    </script>
</body>

</html>
